<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.8" />
    </linearGradient>

    <!-- Title Glow Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Radial Glow Behind Title -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: 3px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
    }
    .badge-bg {
      fill: #0f172a;
      stroke: #1e293b;
      stroke-width: 1;
    }
    .node {
      fill: #38bdf8;
      opacity: 0.35;
    }
    .line {
      stroke: #38bdf8;
      stroke-width: 0.8;
      opacity: 0.2;
    }
  </style>

  <!-- Background Rect with subtle rounded border -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" />
  <rect width="100%" height="100%" fill="url(#glow)" rx="12" />

  <!-- Constellation / Tech Nodes -->
  <g>
    <line x1="80" y1="50" x2="160" y2="80" class="line" />
    <line x1="160" y1="80" x2="120" y2="130" class="line" />
    <line x1="720" y1="60" x2="770" y2="110" class="line" />
    <line x1="770" y1="110" x2="690" y2="140" class="line" />
    <circle cx="80" cy="50" r="3" class="node" />
    <circle cx="160" cy="80" r="4" class="node" />
    <circle cx="120" cy="130" r="3" class="node" />
    <circle cx="720" cy="60" r="3.5" class="node" />
    <circle cx="770" cy="110" r="3" class="node" />
    <circle cx="690" cy="140" r="4" class="node" />
  </g>

  <!-- Waves -->
  <path d="M0 160 C 200 130, 350 200, 550 165 C 700 140, 780 180, 850 160 L 850 220 L 0 220 Z" fill="url(#wave1)" />
  <path d="M0 180 C 180 150, 320 210, 520 180 C 680 155, 760 195, 850 175 L 850 220 L 0 220 Z" fill="url(#wave2)" />

  <!-- Content -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Main Title -->
    <text x="425" y="85" class="title">DARWIN</text>

    <!-- Subtitle -->
    <text x="425" y="122" class="subtitle">Web Developer  ➔  Data Engineering &amp; AI Specialist</text>

    <!-- Mini tags -->
    <g transform="translate(185, 142)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="105" height="24" rx="12" class="badge-bg" />
      <text x="52" y="16" text-anchor="middle" class="badge-text">🐍 Python &amp; SQL</text>

      <!-- Tag 2 -->
      <rect x="115" y="0" width="115" height="24" rx="12" class="badge-bg" />
      <text x="172" y="16" text-anchor="middle" class="badge-text">⚡ Big Data / ETL</text>

      <!-- Tag 3 -->
      <rect x="240" y="0" width="120" height="24" rx="12" class="badge-bg" />
      <text x="300" y="16" text-anchor="middle" class="badge-text">☁️ Cloud &amp; Azure</text>

      <!-- Tag 4 -->
      <rect x="370" y="0" width="110" height="24" rx="12" class="badge-bg" />
      <text x="425" y="16" text-anchor="middle" class="badge-text">🤖 AI &amp; ML</text>
    </g>
  </g>
</svg>
